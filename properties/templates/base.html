<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Appraisal System{% endblock %}</title>

    {% block extra_head %}{% endblock %}
</head>

<body>

    <!-- GLOBAL HOME BUTTON -->
    <a href="{% url 'navigation' %}" class="home-btn">Home</a>

    <style>
        .home-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #1f1f1f;
            color: #fff;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.95rem;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
            transition: all .25s ease;
            z-index: 9999;
        }
        .home-btn:hover {
            background: #333;
            transform: translateY(-3px);
        }
    </style>

    <!-- PAGE CONTENT -->
    <div class="page-content">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
